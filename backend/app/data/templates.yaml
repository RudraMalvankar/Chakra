# backend/app/data/templates.yaml
templates:
  - id: dlt_upi_alternate_v1
    channel: whatsapp
    body: "Hi {name}, your {merchant} subscription payment of ₹{amount} failed. Pay via UPI: {link}"
    variables: [name, merchant, amount, link]
    registered_with: jio_dlt

  - id: dlt_card_update_v1
    channel: email
    body: "Your card ending {last4} expired. Update here: {link}"
    variables: [last4, link]
    registered_with: airtel_dlt

  - id: dlt_afa_threshold_v1
    channel: sms
    body: "Your {merchant} payment of ₹{amount} exceeds RBI limits for auto-debit. Approve with OTP: {link}"
    variables: [merchant, amount, link]
    registered_with: vi_dlt

  - id: dlt_first_txn_v1
    channel: whatsapp
    body: "To activate your {merchant} subscription mandate, your first payment of ₹{amount} requires approval: {link}"
    variables: [merchant, amount, link]
    registered_with: jio_dlt

  - id: sub_recovery_link
    channel: email
    body: "Your subscription payment is overdue. Please update your payment method here: {link}"
    variables: [link]
    registered_with: mock_dlt

  - id: checkout_recovery
    channel: whatsapp
    body: "You left something in your cart! Complete your purchase here: {link}"
    variables: [link]
    registered_with: mock_dlt

  - id: invoice_reminder
    channel: email
    body: "This is a reminder that your invoice is due soon."
    variables: []
    registered_with: mock_dlt

  - id: invoice_link
    channel: email
    body: "Your invoice is overdue. Please pay here: {link}"
    variables: [link]
    registered_with: mock_dlt

  - id: sms_payment_failed_link
    channel: sms
    body: "Namaste {name}, your payment of Rs. {amount} failed. Complete your payment securely here: {link}"
    variables: [name, amount, link]
    registered_with: twilio_dlt

  - id: sms_promise_due_tomorrow
    channel: sms
    body: "Namaste {name}, reminder that your payment promise of Rs. {amount} is due tomorrow ({date}). Pay securely: {link}"
    variables: [name, amount, date, link]
    registered_with: twilio_dlt

  - id: sms_promise_due_today
    channel: sms
    body: "Namaste {name}, your payment of Rs. {amount} is due today. Please complete your payment here: {link}"
    variables: [name, amount, link]
    registered_with: twilio_dlt

  - id: sms_promise_overdue_yesterday
    channel: sms
    body: "Namaste {name}, your payment promise of Rs. {amount} was due yesterday. To avoid account escalation, pay now: {link}"
    variables: [name, amount, link]
    registered_with: twilio_dlt

  - id: sub_pause_notification
    channel: sms
    body: "Namaste {name}, your {merchant} subscription of Rs. {amount} has been paused due to payment failure. Resume here: {link}"
    variables: [name, merchant, amount, link]
    registered_with: twilio_dlt

  - id: sub_resume_notification
    channel: sms
    body: "Namaste {name}, your {merchant} subscription has been successfully resumed. Thank you!"
    variables: [name, merchant]
    registered_with: twilio_dlt

  - id: sub_cancellation_warning
    channel: sms
    body: "Urgent: Your {merchant} subscription will be cancelled in {days} days due to unpaid dues of Rs. {amount}. Pay now: {link}"
    variables: [name, merchant, days, amount, link]
    registered_with: twilio_dlt

  - id: sub_dunning_stage_2
    channel: email
    body: "Your subscription payment is overdue. Please update your payment method to avoid service interruption: {link}"
    variables: [link]
    registered_with: mock_dlt

  - id: sub_dunning_stage_3
    channel: sms
    body: "Namaste {name}, we tried reaching you about your Rs. {amount} subscription payment. Please pay here: {link}"
    variables: [name, amount, link]
    registered_with: twilio_dlt
