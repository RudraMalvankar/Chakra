# backend/app/data/rules.yaml
afa_thresholds:
  standard: 15000       # ₹15,000 INR
  high_value: 100000    # ₹1,00,000 INR (insurance, MF, credit cards)

network_retry_caps:
  visa:
    max_retries: 15
    window_days: 30
  mastercard:
    max_retries: 10
    window_days: 30
  rupay:
    max_retries: 15
    window_days: 30

hard_decline_codes:
  - fraud_flag
  - mandate_revoked
  - invalid_account_number

first_transaction_afa_required: true

recovery_budget:
  max_interventions_per_customer_per_month: 3
